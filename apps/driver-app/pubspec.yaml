name: hatly_driver
description: Hatly driver application — accept deliveries, navigate, track earnings.
publish_to: "none"
version: 1.0.5+14

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.6.0
  flutter_secure_storage: ^9.2.2

  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

  intl: ^0.20.3
  google_maps_flutter: ^2.9.0

  geolocator: ^13.0.1

  # M4 — Proof of Delivery: a delivery photo capture step before a delivery can be
  # marked DELIVERED. Same package/version the Customer app already uses for its own
  # photo-capture flows (apps/customer-app/pubspec.yaml) — no new pattern invented.
  image_picker: ^1.0.7

  # PHASE I-A, CHUNK 5 addition: opens the customer's location in an
  # external maps app (no internal map/navigation built — per the
  # locked decision, google_maps_flutter above remains unused for
  # this).
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
