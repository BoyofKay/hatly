# Test-only Android installers for owner review. No Play signing key and no production deploy.
name: Hatly QA Android APKs
on:
  push:
    branches: [feature/ux-polish-current-release-20261123]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hatly-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # Full widget/unit suite runs in the separate CI workflow; do not duplicate 1000+ tests here.
      - name: Build staging QA APK (debug-signed; NOT Play upload signed)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api-sales.hatly.dev/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: hatly-${{ matrix.app }}-qa-${{ github.run_number }}
          path: apps/${{ matrix.app }}-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
