# Unsigned-for-Play QA APK. No production deployment or signing secrets used.
# Backend must be deployed separately before testing newly introduced API routes.
name: Driver app build

on:
  push:
    branches:
      - feature/profile-shift-brand-20261123
    paths:
      - 'apps/driver-app/**'
      - '.github/workflows/driver-app-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Driver app build (QA APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/driver-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build QA APK (debug-signed; NOT Google Play uploadable)
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api-sales.hatly.dev/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: hatly-driver-qa-apk-${{ github.run_number }}
          path: apps/driver-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
