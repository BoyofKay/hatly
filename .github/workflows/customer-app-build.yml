# Builds the customer Android app on GitHub (no Mac needed). Starts when a commit is pushed to the `app-build` branch, or from
# Actions → Customer app build → Run workflow. The result (AAB for Google Play + APK for installing on a phone) is attached to the run:
# open the run and download "customer-app-<version>" under Artifacts.
#
# Play Store signing: Google Play only accepts a bundle signed with YOUR upload key. Add these repository secrets once
# (Settings → Secrets and variables → Actions; never paste them in chat):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   the upload keystore file (.jks) as base64   (on a Mac: base64 -i upload-keystore.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD        its store password
#   ANDROID_KEY_ALIAS                its key alias
#   ANDROID_KEY_PASSWORD             its key password
# Optional: GOOGLE_SERVICES_JSON (the Firebase android/app/google-services.json content) to turn on push notifications.
# Without the keystore secrets the run still builds, but the files are signed with a throw-away debug key: fine for testing on a
# phone, REJECTED by Google Play. The run summary says which one you got.
name: Customer app build

on:
  push:
    branches: [app-build]
  workflow_dispatch:

permissions:
  contents: write # only to append the build record to the ops-log branch

concurrency:
  group: customer-app-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Signing setup
        id: sign
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PASS" ] && [ -n "$ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            { echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"; echo "storePassword=$KS_PASS"; echo "keyAlias=$ALIAS"; echo "keyPassword=$KEY_PASS"; } > android/key.properties
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "push=yes" >> "$GITHUB_OUTPUT"; else echo "push=no" >> "$GITHUB_OUTPUT"; fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build
        id: build
        run: |
          V="$(sed -n 's/^version: //p' pubspec.yaml)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          flutter build appbundle --release --dart-define=API_BASE_URL=https://api.hatly.dev/api/v1
          flutter build apk --release --dart-define=API_BASE_URL=https://api.hatly.dev/api/v1
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/hatly-customer-$V.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/hatly-customer-$V.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum * > SHA256SUMS && ls -l && cat SHA256SUMS)

      # The Play Store bundle (.aab) as a normal artifact (GitHub always zips artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: customer-app-${{ steps.build.outputs.version }}-aab
          path: |
            ${{ runner.temp }}/out/*.aab
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 30

      # Owner request 2026-11-23: the phone install file must NOT be inside a zip (phone file managers block installing from zips).
      # It is attached to a GitHub pre-release instead, where it downloads as a plain .apk (Releases page, or the link in the summary).
      - name: APK as a direct download (GitHub release)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.build.outputs.version }}
        run: |
          TAG="customer-app-v${V//+/-b}-run$GITHUB_RUN_ID"
          gh release create "$TAG" "$RUNNER_TEMP"/out/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Customer app $V (install file)" \
            --notes "Android install file (.apk) for the customer app $V. Open this page on the phone, tap the .apk under Assets, then install. Build run $GITHUB_RUN_ID."
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary + record
        if: always()
        working-directory: .
        run: |
          {
            echo "### Customer app ${{ steps.build.outputs.version }} — ${{ job.status }}"
            if [ "${{ steps.sign.outputs.signed }}" = yes ]; then echo "Signed with the **upload key** → the .aab can go to Google Play."; else echo "**Debug-signed** (no keystore secrets) → install the .apk on a phone to test; Google Play will reject it."; fi
            echo "Push notifications: ${{ steps.sign.outputs.push }}"
            echo "APK (direct download, no zip): ${{ steps.release.outputs.url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/rec.txt"
          cat "$RUNNER_TEMP/out/SHA256SUMS" >> "$RUNNER_TEMP/rec.txt" 2>/dev/null || true
          git config user.name "hatly-ops"; git config user.email "ops@users.noreply.github.com"
          W="$RUNNER_TEMP/opslog"
          if git fetch -q --depth 1 origin ops-log 2>/dev/null; then git worktree add -q -B ops-log "$W" FETCH_HEAD
          else git worktree add -q --detach "$W" && git -C "$W" checkout -q --orphan ops-log && git -C "$W" rm -rfq .; fi
          mkdir -p "$W/logs" && cp "$RUNNER_TEMP/rec.txt" "$W/logs/$(date -u +%Y%m%dT%H%M%SZ)-app-build-$GITHUB_RUN_ID.log"
          git -C "$W" add logs && git -C "$W" commit -qm "app build record $GITHUB_RUN_ID" && git -C "$W" push -q origin ops-log

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks" android/app/google-services.json
